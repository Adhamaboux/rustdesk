name: Windows installer validation
'on':
  push:
    branches:
    - codex/validate-windows-input
    paths:
    - .github/workflows/windows-installer-validation.yml
  workflow_dispatch: {}
permissions:
  contents: read
env:
  FLUTTER_VERSION: 3.24.5
  CARGO_BUILD_JOBS: 4
  VCPKG_MAX_CONCURRENCY: 4
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
  VCPKG_DISABLE_METRICS: '1'
jobs:
  bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-22.04
          extra-build-args: ''
          flutter-version: 3.22.3
          artifact-name: bridge-artifact
    steps:
    - name: Checkout exact PR source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: Adhamaboux/rustdesk
        ref: 286bf883e3cb9e84a2252e4fc7a07a997826bc7d
        submodules: recursive
        persist-credentials: false
    - name: Install prerequisites
      run: |
        sudo apt-get install ca-certificates -y
        sudo apt-get update -y
        sudo apt-get install -y \
          clang \
          cmake \
          curl \
          gcc \
          git \
          g++ \
          libclang-dev \
          libgtk-3-dev \
          llvm-dev \
          nasm \
          ninja-build \
          pkg-config \
          wget
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: bridge-${{ matrix.job.os }}
    - name: Cache Bridge
      id: cache-bridge
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
      with:
        path: /tmp/flutter_rust_bridge
        key: bridge-${{ matrix.job.flutter-version }}
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ matrix.job.flutter-version }}
        cache: true
    - name: Install flutter rust bridge deps
      shell: bash
      run: |
        cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
        cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
        if [[ "${{ matrix.job.flutter-version }}" == "3.22.3" ]]; then
          # Default Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
        else
          # Flutter 3.44 bridge for Windows arm64: match that build's source/pubspec state so the
          # generated *.freezed.dart compiles against the same Flutter/freezed it resolves.
          bash .github/patches/apply_flutter_3.44_source_patches.sh
        fi
        pushd flutter && flutter pub get && popd
    - name: Run flutter rust bridge
      run: |
        ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
        cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.job.artifact-name }}
        path: |
          ./src/bridge_generated.rs
          ./src/bridge_generated.io.rs
          ./flutter/lib/generated_bridge.dart
          ./flutter/lib/generated_bridge.freezed.dart
          ./flutter/macos/Runner/bridge_generated.h
          ./flutter/ios/Runner/bridge_generated.h
    env:
      CARGO_EXPAND_VERSION: 1.0.95
      FLUTTER_RUST_BRIDGE_VERSION: 1.80.1
      RUST_VERSION: '1.75'
    timeout-minutes: 60
  topmost:
    uses: Adhamaboux/rustdesk/.github/workflows/third-party-RustDeskTempTopMostWindow.yml@286bf883e3cb9e84a2252e4fc7a07a997826bc7d
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
  windows:
    runs-on: windows-2022
    needs:
    - bridge
    - topmost
    timeout-minutes: 150
    steps:
    - name: Checkout exact PR source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: Adhamaboux/rustdesk
        ref: 286bf883e3cb9e84a2252e4fc7a07a997826bc7d
        submodules: recursive
        persist-credentials: false
    - name: Install Rust 1.75.0
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.75.0
        components: clippy,rustfmt
        targets: x86_64-pc-windows-msvc
    - name: Install LLVM 15.0.6
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: 15.0.6
    - name: Install CMake and select release-only native libraries
      shell: pwsh
      run: |
        python -m pip install cmake==4.3.0
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $triplets = Join-Path $env:RUNNER_TEMP 'input-validation-triplets'
        New-Item -ItemType Directory -Force -Path $triplets | Out-Null
        @'
        set(VCPKG_TARGET_ARCHITECTURE x64)
        set(VCPKG_CRT_LINKAGE static)
        set(VCPKG_LIBRARY_LINKAGE static)
        set(VCPKG_BUILD_TYPE release)
        '@ | Set-Content -LiteralPath (Join-Path $triplets 'x64-windows-static.cmake')
        "VCPKG_OVERLAY_TRIPLETS=$triplets" >> $env:GITHUB_ENV
    - name: Set up the upstream-pinned vcpkg
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
    - name: Install native dependencies
      shell: bash
      run: |
        set -o pipefail
        "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed" 2>&1 | tee native-build.log
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: input-queue-windows-msvc
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        channel: stable
        flutter-version: 3.24.5
        architecture: x64
    - name: Replace engine with rustdesk custom flutter engine
      run: |
        flutter doctor -v
        flutter precache --windows
        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/
    - name: Patch flutter
      shell: bash
      run: |
        cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - name: Record source and selected release features
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p validation
        test "$(git rev-parse HEAD)" = "286bf883e3cb9e84a2252e4fc7a07a997826bc7d"
        git diff --exit-code
        git rev-parse HEAD > validation/source-commit.txt
        git submodule status > validation/submodules.txt
        rustc -Vv > validation/rust-version.txt
        flutter --version > validation/flutter-version.txt
        FEATURES=$(python ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram --print-features)
        test "$FEATURES" = "hwcodec,vram,flutter"
        echo "$FEATURES,coalesce-mouse-moves" > validation/features.txt
        sha256sum windows-x64-release.zip > validation/engine-sha256.txt
    - name: Build rustdesk
      run: |
        # Windows: build RustDesk
        # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
        cargo build --locked --release --lib --features hwcodec,vram,flutter,coalesce-mouse-moves
        if ($LASTEXITCODE -ne 0) { throw "Rust library build failed" }
        python .\build.py --portable --flutter --skip-portable-pack --skip-cargo --hwcodec --vram
        if ($LASTEXITCODE -ne 0) { throw "Flutter build failed" }
        mv ./flutter/build/windows/x64/runner/Release ./rustdesk

        # Download usbmmidd_v2.zip and extract it to ./rustdesk
        Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
        Expand-Archive usbmmidd_v2.zip -DestinationPath .
        Remove-Item -Path usbmmidd_v2\Win32 -Recurse
        Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
        mv -Force .\usbmmidd_v2 ./rustdesk

        # Download printer driver files and extract them to ./rustdesk
        try {
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

          # Check and move the files
          $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
          $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
          $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
          $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
          if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
              Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
              mkdir ./rustdesk/drivers
              mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath .
              mv -Force .\printer_driver_adapter.dll ./rustdesk
          } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
              Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
          } else {
              Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
          }
        } catch {
            Write-Host "Ingore the printer driver error."
        }
    - name: Verify complete bundle and source scope
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($file in 'rustdesk.exe','librustdesk.dll','flutter_windows.dll','dylib_virtual_display.dll','data/icudtl.dat','data/app.so') {
          if (-not (Test-Path "rustdesk/$file")) { throw "Missing bundle file: $file" }
        }
        if ((Get-FileHash rustdesk/librustdesk.dll).Hash -ne (Get-FileHash target/release/librustdesk.dll).Hash) { throw 'Library payload mismatch' }
        $version = (& ./rustdesk/rustdesk.exe --version | Out-String).Trim()
        if ($version -ne '1.5.1') { throw "Unexpected application version: $version" }
        git diff --exit-code -- Cargo.toml Cargo.lock src libs
        if ($LASTEXITCODE -ne 0) { throw 'Tracked source changed during build' }
    - name: find Runner.res
      continue-on-error: true
      shell: bash
      run: |
        runner_res=$(find . -name "Runner.res");
        if [ "$runner_res" == "" ]; then
          echo "Runner.res: not found";
        else
          echo "Runner.res: $runner_res";
          cp $runner_res ./libs/portable/Runner.res;
          echo "list ./libs/portable/Runner.res";
          ls -l ./libs/portable/Runner.res;
        fi
    - name: Download RustDeskTempTopMostWindow artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: topmostwindow-artifacts-x64
        path: ./rustdesk
    - name: Build self-extracted executable
      shell: bash
      run: |
        set -euo pipefail
        sed -i '/dpiAware/d' res/manifest.xml
        pushd ./libs/portable
        pip3 install -r requirements.txt
        python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
        popd
        mkdir -p ./SignOutput
        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-1.5.1-input-test-x86_64.exe
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      with:
        msbuild-architecture: x86
    - name: Build complete MSI installer
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Push-Location res/msi
        python preprocess.py --arp -d ../../rustdesk
        if ($LASTEXITCODE -ne 0) { throw 'MSI preprocessing failed' }
        nuget restore msi.sln
        if ($LASTEXITCODE -ne 0) { throw 'MSI dependencies failed' }
        msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
        if ($LASTEXITCODE -ne 0) { throw 'MSI build failed' }
        $packages = @(Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi)
        if ($packages.Count -ne 1) { throw 'Expected exactly one MSI' }
        Copy-Item $packages[0].FullName ../../SignOutput/rustdesk-1.5.1-input-test-x86_64.msi
        Pop-Location
    - name: Record artifact checksums
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Get-ChildItem SignOutput -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content validation/SHA256SUMS
        Copy-Item validation/source-commit.txt,validation/features.txt,validation/SHA256SUMS SignOutput
        @'
        Experimental unsigned Windows x64 build of PR #16666.
        Source: 286bf883e3cb9e84a2252e4fc7a07a997826bc7d
        Features: hwcodec,vram,flutter,coalesce-mouse-moves
        This is not an official RustDesk release. Test only in a disposable environment.
        Do not replace an existing working installation without a separate rollout decision.
        '@ | Set-Content SignOutput/BUILD-INFO.txt
      id: packages
    - name: Full Windows Rust tests with feature enabled
      shell: bash
      if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
      run: |-
        set -euo pipefail
        cargo test --locked --release --lib --features hwcodec,vram,flutter,coalesce-mouse-moves -- --test-threads=1 2>&1 | tee "validation/full-windows-rust-tests-with-feature-enabled.log"
    - name: Full Windows Rust tests with feature disabled
      shell: bash
      if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
      run: |-
        set -euo pipefail
        cargo test --locked --release --lib --features hwcodec,vram,flutter -- --test-threads=1 2>&1 | tee "validation/full-windows-rust-tests-with-feature-disabled.log"
    - name: Windows clipboard tests
      shell: bash
      if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
      run: |-
        set -euo pipefail
        cargo test --locked --release -p clipboard -- --test-threads=1 2>&1 | tee "validation/windows-clipboard-tests.log"
    - name: Windows Clippy with Flutter and feature enabled
      shell: bash
      if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
      run: |-
        set -euo pipefail
        cargo clippy --locked --release --lib --features hwcodec,vram,flutter,coalesce-mouse-moves -- --no-deps 2>&1 | tee "validation/windows-clippy-with-flutter-and-feature-enabled.log"
    - name: Flutter regression tests
      shell: bash
      if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
      run: |-
        set -euo pipefail
        cd flutter
        flutter test 2>&1 | tee "../validation/flutter-regression-tests.log"
    - name: Install and uninstall on disposable runner
      shell: pwsh
      if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
      run: |
        $ErrorActionPreference = 'Stop'
        if (Get-Service RustDesk -ErrorAction SilentlyContinue) { throw 'Refusing to replace an existing RustDesk service' }
        $installDir = Join-Path $env:ProgramFiles 'RustDesk'
        if (Test-Path $installDir) { throw 'Refusing to replace an existing installation' }
        $msi = (Resolve-Path SignOutput/rustdesk-1.5.1-input-test-x86_64.msi).Path
        $log = Join-Path $env:GITHUB_WORKSPACE 'validation/msi-install.log'
        $cleanupLog = Join-Path $env:GITHUB_WORKSPACE 'validation/msi-uninstall.log'
        try {
          $proc = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru -WindowStyle Hidden
          if ($proc.ExitCode -notin 0,3010) { throw "MSI install failed: $($proc.ExitCode)" }
          $installed = Join-Path $installDir 'librustdesk.dll'
          if ((Get-FileHash $installed).Hash -ne (Get-FileHash rustdesk/librustdesk.dll).Hash) { throw 'Installed DLL mismatch' }
          $svc = Get-Service RustDesk
          if ($svc.Status -ne 'Running') { throw "Service not running: $($svc.Status)" }
          $version = (& "$installDir/rustdesk.exe" --version | Out-String).Trim()
          if ($version -ne '1.5.1') { throw 'Installed application version mismatch' }
          'MSI installed, payload hash matched, service running, version correct.' | Set-Content validation/install-smoke.txt
        } finally {
          $proc = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /l*v `"$cleanupLog`"" -Wait -PassThru -WindowStyle Hidden
          if ($proc.ExitCode -notin 0,3010,1605) { throw "MSI uninstall failed: $($proc.ExitCode)" }
        }
        if (Get-Service RustDesk -ErrorAction SilentlyContinue) { throw 'Service remains after uninstall' }
        if (Test-Path "$installDir/librustdesk.dll") { throw 'Application DLL remains after uninstall' }
        'MSI uninstall removed service and application DLL.' | Add-Content validation/install-smoke.txt
    - name: Upload experimental installer and checksums
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
      with:
        name: rustdesk-input-test-windows-x64
        path: SignOutput/
        if-no-files-found: error
        retention-days: 30
    - name: Upload validation evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: windows-installer-validation-evidence
        path: validation/
        if-no-files-found: warn
        retention-days: 30
